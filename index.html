<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الكشاف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wall" id="wall"></div>

<div class="dark" id="dark"></div>
<div class="beam" id="beam"></div>
<div class="wall ghost" id="ghost"></div>

<div class="counter" id="counter">اكتشفتي 0 / 12</div>
<div class="hint" id="hint">حركي الكشاف في الضلمة 🔦</div>

<div class="finale" id="finale">
  <div class="finale-card">
    <div class="finale-star">✦</div>
    <p class="finale-text">بحبك يا ملك</p>
    <p class="finale-sub">يا أم ليلى 💗</p>
    <div class="finale-line"></div>
    <p class="finale-sign">مازن × ملك</p>
    <p class="finale-tap">دوسي في أي مكان</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
